<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Workspace</title>

    <link rel="stylesheet" href="drag.css">
    <script defer src="drag.js"></script>
</head>

<body>

    <!-- LEFT SIDE -->
    <div id="sidebar">

        <h2 id="title">Images</h2>

        <div id="imageContainer">
           <img id="image1" src="imgone.jpg" draggable="true">
            <img id="image2" src="imgtwo.jpg" draggable="true">
            <img id="image3" src="imgthree.jpg" draggable="true">
            <img id="image4" src="imgfour.jpg" draggable="true">
            <img id="image5" src="imgfive.jpg" draggable="true">
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div id="workspaceArea">
      <div id="workspace">
       <div id="placeholder">
       <div id="plus">＋</div>
      <div>Drag an image here to add to workspace</div>
     </div>
   </div>
 </div>
</body>
</html>
